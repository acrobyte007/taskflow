<!DOCTYPE html>
<html>
<head>
    <title>Create Task</title>
</head>
<body>

    <h1>Create a Task</h1>

    <form method="POST">
        {% csrf_token %}

        <label>Task Title:</label>
        <input type="text" name="title" required>

        <br><br>

        <button type="submit">Create Task</button>
    </form>

</body>
</html>
